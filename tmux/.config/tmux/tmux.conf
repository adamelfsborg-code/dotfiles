# Rebuilt 2026-10-30 from a running tmux server (show-options -g + list-keys)

# prefix: C-a instead of C-b
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# splits
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# resize panes (repeatable) and zoom
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

set -g mouse on

# let kitty graphics (tdf, images) through to Ghostty
set -g allow-passthrough on

# pick a PDF below the pane's directory with fzf and open it in tdf in a split
bind P split-window -h -l 50% -c "#{pane_current_path}" 'f=$(find . -name "*.pdf" -not -path "*/.*" 2>/dev/null | fzf --prompt="PDF> ") && exec tdf "$f"'

# vi copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

set -g @catppuccin_flavor 'mocha'

# keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'
